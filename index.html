<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=dark_mode" />
    <title>Calculator</title>
</head>
    <body>
      
       <!-- Dark Mode Button -->
        <div class="dark-mode-button-container">
        <button class="dark-mode-button" id=dark-mode-btn onclick="toggleDarkMode()" >
            <span class="material-symbols-outlined">
                dark_mode
            </span>
       </button>
       </div>
       
       <!-- Calculator  -->
        <div class="calculator">
            <input type="text" id="display" disabled>
            <div class="buttons">
                <button class="btn" onclick="clearDisplay()" >C</button>
                <button class="btn" onclick="deleteLast('last')" >←</button>
                <button class="btn" onclick="appendToDisplay('/')">/</button>
                <button class="btn" onclick="appendToDisplay('*')">*</button>
                <button class="btn" id="btn1" onclick="appendToDisplay('7')">7</button>
                <button class="btn" id="btn1" onclick="appendToDisplay('8')">8</button>
                <button class="btn" id="btn1" onclick="appendToDisplay('9')">9</button>
                <button class="btn" onclick="appendToDisplay('-')">-</button>
                <button class="btn" id="btn1" onclick="appendToDisplay('4')">4</button>
                <button class="btn" id="btn1" onclick="appendToDisplay('5')">5</button>
                <button class="btn" id="btn1" onclick="appendToDisplay('6')">6</button>
                <button class="btn" onclick="appendToDisplay('+')">+</button>
                <button class="btn" id="btn1" onclick="appendToDisplay('1')">1</button>
                <button class="btn" id="btn1" onclick="appendToDisplay('2')">2</button>
                <button class="btn" id="btn1" onclick="appendToDisplay('3')">3</button>
                <button class="btn" id="btn1" onclick="appendToDisplay('0')">0</button>
                <button class="btn" onclick="appendToDisplay('.')" >.</button>
                <button class="btn equal" onclick="calculateResult()" >=</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
